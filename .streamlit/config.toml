[server]
headless = true
maxUploadSize = 25
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#bd4b25"
backgroundColor = "#100e12"
secondaryBackgroundColor = "#211d24"
textColor = "#fff6ed"
borderColor = "#443640"
baseRadius = "0.75rem"
font = "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
showWidgetBorder = true
